<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 48" role="img" aria-label="Circle Prospecting AI">
  <defs>
    <linearGradient id="cpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#a2d729"/>
    </linearGradient>
  </defs>
  <!-- Left circuit traces -->
  <g fill="none" stroke="url(#cpGrad)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 30h8l4-4"/>
    <path d="M2 22h11l3 3"/>
    <path d="M2 14h6l5 5"/>
    <circle cx="2" cy="30" r="2" fill="#007aff" stroke="none"/>
    <circle cx="2" cy="22" r="2" fill="#007aff" stroke="none"/>
    <circle cx="2" cy="14" r="2" fill="#007aff" stroke="none"/>
  </g>
  <!-- Map pin + house (center mark) -->
  <g transform="translate(22, 3)">
    <!-- Pin body -->
    <path fill="url(#cpGrad)" d="M22 2.5C14.55 2.5 8.5 8.55 8.5 16c0 9.2 11.2 18.8 13.5 26.5 2.3-7.7 13.5-17.3 13.5-26.5C35.5 8.55 29.45 2.5 22 2.5z"/>
    <!-- Inner cutout feel: roof + body as lighter overlay -->
    <path fill="rgba(255,255,255,0.22)" d="M22 9.5c-3.6 0-6.5 2.9-6.5 6.5 0 4.8 6.5 11.2 6.5 15.2 0-4 6.5-10.4 6.5-15.2 0-3.6-2.9-6.5-6.5-6.5z"/>
    <!-- Arc over roof -->
    <path fill="none" stroke="url(#cpGrad)" stroke-width="1.6" stroke-linecap="round" d="M13 12.5a9 9 0 0 1 18 0"/>
    <!-- House -->
    <path fill="#f8fafc" d="M22 14.2l-5.2 4.4h1.3v6.2h3.1v-3.6h1.6v3.6h3.1v-6.2h1.3L22 14.2z"/>
    <rect x="19.4" y="17.8" width="2.2" height="2.2" rx="0.35" fill="rgba(5,12,26,0.35)"/>
    <rect x="22.4" y="17.8" width="2.2" height="2.2" rx="0.35" fill="rgba(5,12,26,0.35)"/>
    <rect x="19.4" y="20.4" width="2.2" height="2.2" rx="0.35" fill="rgba(5,12,26,0.35)"/>
    <rect x="22.4" y="20.4" width="2.2" height="2.2" rx="0.35" fill="rgba(5,12,26,0.35)"/>
    <!-- Chimney -->
    <rect x="26.8" y="12.6" width="2.2" height="3.4" rx="0.3" fill="#f8fafc"/>
  </g>
  <!-- Right circuit traces -->
  <g fill="none" stroke="url(#cpGrad)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66 30h-8l-4-4"/>
    <path d="M66 22h-11l-3 3"/>
    <path d="M66 14h-6l-5 5"/>
    <circle cx="66" cy="30" r="2" fill="#a2d729" stroke="none"/>
    <circle cx="66" cy="22" r="2" fill="#a2d729" stroke="none"/>
    <circle cx="66" cy="14" r="2" fill="#a2d729" stroke="none"/>
  </g>
  <!-- Wordmark -->
  <text x="78" y="31" fill="#0f172a" font-family="Plus Jakarta Sans, ui-sans-serif, system-ui, sans-serif" font-size="17.5" font-weight="800" letter-spacing="-0.03em">
    Circle Prospecting <tspan fill="url(#cpGrad)">AI</tspan>
  </text>
</svg>
