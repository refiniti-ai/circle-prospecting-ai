    <script>
      function getFPTid() {
        return window.FPROM && window.FPROM.data.tid;
      }
      function initializeFPRBuyLinks() {
        var buyStripeLinks = document.querySelectorAll('a[href^="https://buy.stripe.com/"]');
        buyStripeLinks.forEach(function (link) {
          var oldBuyStripeUrl = link.getAttribute("href");
          var tid = getFPTid();
          if (!tid || !oldBuyStripeUrl) return;
          var url = new URL(oldBuyStripeUrl);
          url.searchParams.set("client_reference_id", tid);
          link.setAttribute("href", url.toString());
        });
      }
      window.scheduleFPRBuyLinks = function () {
        setTimeout(initializeFPRBuyLinks, 1000);
      };
      var stateCheck = setInterval(function () {
        if (document.readyState === "complete") {
          clearInterval(stateCheck);
          window.scheduleFPRBuyLinks();
        }
      }, 100);
      window.addEventListener("load", window.scheduleFPRBuyLinks);
      window.addEventListener("popstate", window.scheduleFPRBuyLinks);
      var _pushState = history.pushState;
      history.pushState = function () {
        _pushState.apply(history, arguments);
        window.scheduleFPRBuyLinks();
      };
    </script>
